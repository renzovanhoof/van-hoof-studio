<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Hoof Studio | Under Construction</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --vhs-blue: #004aad;
            --vhs-gold: #ffde59;
            --vhs-white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--vhs-blue);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* Subtiele achtergrond animatie */
        .bg-overlay {
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(255,222,89,0.05) 0%, rgba(0,74,173,0) 70%);
            animation: pulse 8s infinite alternate;
            z-index: 1;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.5; }
            to { transform: scale(1.2); opacity: 1; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            max-width: 500px;
        }

        .logo {
            width: 100%;
            max-width: 400px;
            height: auto;
            margin-bottom: 40px;
            animation: fadeIn 2s ease-out;
        }

        .content {
            opacity: 0;
            animation: fadeIn 2s ease-out 0.5s forwards;
        }

        h1 {
            color: var(--vhs-gold);
            text-transform: uppercase;
            letter-spacing: 6px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .line {
            width: 40px;
            height: 2px;
            background: var(--vhs-gold);
            margin: 20px auto;
        }

        p {
            color: var(--vhs-white);
            font-weight: 200;
            letter-spacing: 2px;
            line-height: 1.6;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="container">
        <img src="afbeeldingen/logo/6.png" alt="Van Hoof Studio" class="logo">
        
        <div class="content">
            <h1>Coming Soon</h1>
            <div class="line"></div>
            <p>Momenteel werken wij aan een nieuwe digitale ervaring.<br>Onze excuses voor het ongemak.</p>
            <p style="margin-top: 30px; font-size: 0.7rem; opacity: 0.6;">INFO@VANHOOFSTUDIO.NL</p>
        </div>
    </div>

</body>
</html>
